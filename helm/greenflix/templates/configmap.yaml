{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "greenflix.name" . }}
data:
  GREENFLIX_DATABASE_URL: jdbc:sqlite:/data/greenflix.db
  SERVER_PORT: "8080"
  GREENFLIX_PUBLIC_ORIGIN: {{ if and .Values.route.enabled .Values.route.tls.enabled }}{{ printf "https://%s" .Values.route.host | quote }}{{ else }}""{{ end }}
  GREENFLIX_JOURNAL_MODE: {{ .Values.config.journalMode | quote }}
  GREENFLIX_WAL_VERIFIED: {{ .Values.config.walVerified | quote }}
  GREENFLIX_BUSY_TIMEOUT_MS: {{ .Values.config.busyTimeoutMs | quote }}
  GREENFLIX_POOL_SIZE: {{ .Values.config.poolSize | quote }}
{{- end }}
