services:
  greenflix:
    image: ${GREENFLIX_IMAGE:-greenflix:2.0.0-rc.2}
    ports:
      - "${GREENFLIX_BIND_ADDRESS:-127.0.0.1}:${GREENFLIX_PORT:-8080}:${GREENFLIX_CONTAINER_PORT:-8080}"
    environment:
      GREENFLIX_STATE_DIR: /data
      GREENFLIX_SECRETS_DIR: /run/secrets
      GREENFLIX_CERTIFICATE_FILE: /config/server.p12
      GREENFLIX_HEALTH_PORT: ${GREENFLIX_HEALTH_PORT:-8080}
      SPRING_CONFIG_LOCATION: classpath:/application.yml,classpath:/application-distribution.yml,file:/config/application.yml
    volumes:
      - data:/data
      - type: bind
        source: ${GREENFLIX_CONFIG_DIR:?Set GREENFLIX_CONFIG_DIR to a prepared external config directory}
        target: /config
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - greenflix-admin-password-hash
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 1g
    stop_grace_period: 45s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  data:
secrets:
  greenflix-admin-password-hash:
    file: ${GREENFLIX_ADMIN_HASH_FILE:?Set GREENFLIX_ADMIN_HASH_FILE to the protected hash file}
